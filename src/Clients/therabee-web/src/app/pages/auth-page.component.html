<div class="auth-layout">
  <article class="auth-copy">
    <img class="auth-logo" src="/assets/logo.png" alt="TheraBee logo" />
    <p class="eyebrow">Bem-vinda ao TheraBee</p>
    <h1>{{ authMode() === 'login' ? 'Entrar no workspace' : 'Criar conta de terapeuta' }}</h1>
    <p>
      Acede ao hub do terapeuta, aos pacientes sob a tua alçada, ao schedule e aos relatórios clínicos.
    </p>
    <div class="auth-quick-note">
      <strong>{{ apiMessage() }}</strong>
    </div>
  </article>

  <form class="panel auth-panel" (submit)="$event.preventDefault(); authenticate()">
    <div class="segmented">
      <button type="button" [class.active]="authMode() === 'login'" (click)="switchMode('login')">Login</button>
      <button type="button" [class.active]="authMode() === 'register'" (click)="switchMode('register')">Registo</button>
    </div>

    @if (authMode() === 'register') {
      <label>
        Nome
        <input autocomplete="name" [value]="authForm().name" (input)="updateAuth('name', $any($event.target).value)" />
      </label>
      <label>
        Profissao
        <input autocomplete="organization" [value]="authForm().profession" (input)="updateAuth('profession', $any($event.target).value)" />
      </label>
    }

    <label>
      Email
      <input type="email" autocomplete="email" [value]="authForm().email" (input)="updateAuth('email', $any($event.target).value)" />
    </label>
    <label>
      Password
      <input type="password" autocomplete="current-password" [value]="authForm().password" (input)="updateAuth('password', $any($event.target).value)" />
    </label>

    <button type="submit" class="primary-button" [disabled]="isBusy()">
      {{ isBusy() ? 'A autenticar...' : (authMode() === 'login' ? 'Entrar' : 'Criar conta') }}
    </button>
  </form>
</div>
